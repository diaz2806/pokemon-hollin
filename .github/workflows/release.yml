name: Ejecutable de Windows

# Crea el .exe en una máquina Windows de GitHub en cada push a main y lo publica
# en Releases con la versión de package.json (v0.2.0, v0.3.0...). Si la versión no
# cambia, se actualizan los .exe de esa misma Release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          # Sin firma de código: Windows mostrará el aviso de SmartScreen la primera vez.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-hollin-windows
          path: release/*.exe
      - name: Versión
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pokémon Hollín ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: release/*.exe
          body: |
            **Pokémon Hollín** — versión de escritorio para Windows.

            - `PokemonHollin-…-instalador.exe`: instalador (crea acceso directo).
            - `PokemonHollin-…-portable.exe`: sin instalar, doble clic y a jugar.

            Windows puede avisar de que la app no está firmada: «Más información» → «Ejecutar de todas formas».
