name: Ejecutable de Windows

# Crea el .exe en una máquina Windows de GitHub.
# - Al subir una etiqueta vX.Y.Z se publica una Release con los .exe para descargar.
# - También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          # Sin firma de código: Windows mostrará el aviso de SmartScreen la primera vez.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-hollin-windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          body: |
            **Pokémon Hollín** — versión de escritorio para Windows.

            - `Pokemon Hollin-…-nsis.exe`: instalador (crea acceso directo).
            - `PokemonHollin-…-portable.exe`: sin instalar, doble clic y a jugar.

            Windows puede avisar de que la app no está firmada: «Más información» → «Ejecutar de todas formas».
