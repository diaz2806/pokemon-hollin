<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#141416" />
    <title>Pokémon Hollín</title>
    <style>
      html, body { margin: 0; height: 100%; background: #141416; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      body { display: flex; flex-direction: column; font-family: "Press Start 2P", monospace; }
      #game { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; }
      #pad { display: none; flex: 0 0 auto; height: 38vh; max-height: 300px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box;
             background: linear-gradient(#26262b, #1b1b1f); border-top: 3px solid #9a7b45; position: relative; }
      body.touch #pad { display: block; flex: 1 1 auto; height: auto; max-height: none; }
      body.touch #game { flex: 0 0 auto; height: min(75vw, 62vh); }
      .dpad { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 150px; height: 150px; }
      .dpad div { position: absolute; width: 50px; height: 50px; background: #3d3a3a; border: 2px solid #1a1a1c; box-sizing: border-box; border-radius: 6px; }
      .dpad div.on { background: #5c5850; }
      .dpad [data-dir="up"] { left: 50px; top: 0; } .dpad [data-dir="down"] { left: 50px; top: 100px; }
      .dpad [data-dir="left"] { left: 0; top: 50px; } .dpad [data-dir="right"] { left: 100px; top: 50px; }
      .dpad .mid { left: 50px; top: 50px; border-radius: 0; }
      .ab { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 150px; height: 120px; }
      .ab div { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: #7a2f2f; border: 3px solid #1a1a1c; color: #e8e2d4;
                display: flex; align-items: center; justify-content: center; font-size: 14px; box-sizing: border-box; }
      .ab div.on { filter: brightness(1.3); }
      .ab [data-btn="A"] { right: 0; top: 0; } .ab [data-btn="B"] { left: 0; top: 50px; background: #4a4744; }
      .start { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
               background: #3d3a3a; color: #d9d2c3; font-size: 9px; border: 2px solid #1a1a1c; }
      .start.on { background: #5c5850; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="pad">
      <div class="dpad">
        <div data-dir="up"></div><div data-dir="left"></div><div class="mid"></div><div data-dir="right"></div><div data-dir="down"></div>
      </div>
      <div class="start" data-btn="START">MENÚ</div>
      <div class="ab"><div data-btn="A">A</div><div data-btn="B">B</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
